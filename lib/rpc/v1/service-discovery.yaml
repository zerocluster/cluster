title: Service discovery

emits:
  - service-discovery/update

methods:
  set-host-services:
    title: Register host services
    connectionType: websockets
    params:
      - name: services
        required: true
        schema:
          type: object
          properties:
            version: { type: integer, minimum: 1 }
            appName: { type: string, format: kebab-case }
            services:
              type: object
              propertyNames:
                type: string
                # format: uri
              additionalProperties:
                type: object
                properties:
                  serviceName: { type: string, format: kebab-case }
                additionalProperties: false
                required: [serviceName]
          additionalProperties: false
          required: [version, appName, services]

  get-services:
    title: Get services
