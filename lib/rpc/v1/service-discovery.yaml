title: Service discovery

emits:
  - service-discovery/update
  - service-discovery/add-service/*/*
  - service-discovery/delete-service/*/*

methods:
  register-service:
    title: Register service instance
    connectionType: websockets
    params:
      - name: services
        required: true
        schema:
          type: object
          properties:
            appName: { type: string, format: kebab-case }
            services:
              type: object
              propertyNames:
                type: string
                format: url
              additionalProperties:
                type: string
                format: kebab-case
          additionalProperties: false
          required: [appName, services]

  get-services:
    title: Get services
    params:
      - name: options
        schema:
          type: object
          properties:
            appName: { type: string, format: kebab-case }
            serviceName: { type: string, format: kebab-case }
          additionalProperties: false
          required: []
