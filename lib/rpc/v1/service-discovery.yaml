title: Service discovery

emits:
  - service-discovery/update

methods:
  set-host-services:
    title: Register host services
    connectionType: websockets
    params:
      - name: options
        required: true
        schema:
          type: object
          properties:
            version: { type: integer, minimum: 1 }
            appName: { type: string, format: kebab-case }
            services:
              type: object
              propertyNames: { type: string, format: kebab-case }
              additionalProperties:
                type: object
                properties:
                  hostname: { type: string, format: domain-name }
                  port: { type: integer, format: ip-port }
                  pathname:
                    anyOf:
                      - { type: string, format: root-path }
                      - { type: string, format: absolute-path }
                additionalProperties: false
                required: [port, pathname]
          additionalProperties: false
          required: [version, appName, services]

  get-services:
    title: Get services
