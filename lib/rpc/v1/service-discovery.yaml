title: Service discovery

emits:
  - service-discovery/update

methods:
  set-host-services:
    title: Register host services
    connectionType: websockets
    params:
      - name: options
        required: true
        schema:
          type: object
          properties:
            version: { type: integer, minimum: 1 }
            appName: { type: string, format: kebab-case }
            services:
              type: array
              items:
                type: object
                properties:
                  serviceName: { type: string, format: kebab-case }
                  port: { type: integer, format: ip-port }
                  pathname: { type: string }
                additionalProperties: false
                required: [serviceName, port, pathname]
          additionalProperties: false
          required: [version, appName, services]

  get-services:
    title: Get services
